<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>مِرْباح — حساب جديد للتاجر</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&family=Rubik:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
  :root { --paper:#f3ecdd; --page:#fdf9f0; --ink:#33291f; --ink2:#5c5040; --ink3:#93856e; --rule:#d9cbb0; --rule2:#c6b596; --clay:#a8552f; --clay-soft:#f2ddcf; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; background:radial-gradient(900px 480px at 92% -8%, rgba(168,85,47,.08), transparent 62%), var(--paper); color:var(--ink); font-family:'IBM Plex Sans Arabic','Segoe UI',sans-serif; display:grid; place-items:center; padding:24px; }
  .card { width:min(480px,100%); background:var(--page); border:1px solid var(--rule); border-radius:4px; padding:28px; box-shadow:0 18px 40px rgba(80,60,30,.12); }
  .brand { display:flex; align-items:baseline; gap:10px; margin-bottom:18px; }
  .brand b { font-family:Rubik,sans-serif; font-size:1.5rem; font-weight:500; }
  .brand span { font-size:.66rem; letter-spacing:.18em; color:var(--clay); }
  h1 { font-family:Rubik,sans-serif; font-size:1.3rem; font-weight:500; margin:0 0 4px; }
  p.sub { margin:0 0 18px; color:var(--ink3); font-size:.82rem; line-height:1.8; }
  label { display:block; font-size:.74rem; color:var(--ink3); margin-bottom:4px; }
  input { width:100%; padding:10px 12px; border:1px solid var(--rule2); border-radius:3px; background:#fff; font:inherit; font-size:.9rem; color:var(--ink); margin-bottom:12px; }
  input:focus { outline:none; border-color:#7c8a63; box-shadow:0 0 0 3px rgba(124,138,99,.18); }
  .row2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  button { width:100%; padding:11px; border:0; border-radius:999px; background:var(--ink); color:var(--page); font:inherit; font-weight:500; cursor:pointer; margin-top:4px; }
  button:hover { background:var(--clay); }
  button:disabled { opacity:.6; cursor:wait; }
  .err { background:var(--clay-soft); color:#7f3d1e; border-right:3px solid var(--clay); font-size:.8rem; padding:8px 10px; border-radius:2px; margin-bottom:12px; display:none; }
  .err.on { display:block; }
  .ok { background:#e5ecdb; color:#44613a; border-right:3px solid #7c8a63; font-size:.8rem; padding:8px 10px; border-radius:2px; margin-bottom:12px; display:none; }
  .ok.on { display:block; }
  .hint { font-size:.7rem; color:var(--ink3); margin:-8px 0 10px; }
  .foot { margin-top:14px; font-size:.78rem; color:var(--ink2); }
  .foot a { color:var(--clay); text-decoration:none; border-bottom:1px solid var(--clay); }
</style>
</head>
<body>
<form class="card" id="form" novalidate>
  <div class="brand"><b>مِرْباح</b><span>حساب تاجر</span></div>
  <h1>أنشئ حسابك</h1>
  <p class="sub">حسابك يعطيك لوحة تحكم لترتيب تصنيفاتك ومنتجاتك وتكاليفها. بياناتك تُحفظ في مساحتك وحدك.</p>
  <div class="err" id="err" role="alert"></div>
  <div class="ok" id="ok" role="status"></div>
  <label for="name">اسمك</label>
  <input id="name" name="name" autocomplete="name" required placeholder="مثال: نورة العتيبي" />
  <label for="email">البريد الإلكتروني</label>
  <input id="email" name="email" type="email" autocomplete="email" required dir="ltr" placeholder="you@example.com" />
  <div class="row2">
    <div>
      <label for="password">كلمة المرور</label>
      <input id="password" name="password" type="password" autocomplete="new-password" required minlength="8" />
    </div>
    <div>
      <label for="confirm">تأكيدها</label>
      <input id="confirm" name="confirm" type="password" autocomplete="new-password" required minlength="8" />
    </div>
  </div>
  <p class="hint">٨ أحرف على الأقل. لا تُخزَّن كلمة المرور على الجهاز.</p>
  <button id="submit" type="submit">إنشاء الحساب</button>
  <div class="foot">لديك حساب؟ <a href="/login/">دخول</a></div>
</form>
<script src="/public/js/ui.js"></script>
<script>
  (function () {
    const form = document.getElementById('form');
    const err = document.getElementById('err');
    const ok = document.getElementById('ok');
    const btn = document.getElementById('submit');
    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      err.classList.remove('on'); ok.classList.remove('on');
      const password = document.getElementById('password').value;
      if (password !== document.getElementById('confirm').value) {
        err.textContent = 'كلمتا المرور غير متطابقتين.'; err.classList.add('on'); return;
      }
      btn.disabled = true;
      try {
        await MB.post('/api/auth/register', {
          name: document.getElementById('name').value,
          email: document.getElementById('email').value,
          password
        });
        ok.textContent = 'أُنشئ حسابك. أدخل الآن لتكملة إعداد مشروعك.';
        ok.classList.add('on');
        btn.textContent = 'جارٍ تحويلك للدخول…';
        setTimeout(function () { location.href = '/login/?next=' + encodeURIComponent('/dashboard/?setup=1'); }, 900);
      } catch (ex) {
        err.textContent = ex.message;
        err.classList.add('on');
        btn.disabled = false;
      }
    });
  })();
</script>
</body>
</html>
